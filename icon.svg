<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Fundo com cantos arredondados (squircle moderno) -->
  <rect width="512" height="512" rx="112" fill="url(#blueGrad)"/>

  <!-- Letra 'M' MAzevedo Corp estilizada -->
  <g filter="url(#shadow)">
    <path d="M 120 376 L 120 136 L 192 136 L 256 264 L 320 136 L 392 136 L 392 376 L 336 376 L 336 220 L 276 340 L 236 340 L 176 220 L 176 376 Z" fill="#ffffff"/>
  </g>

  <!-- Distintivo de Relógio / REP-P Digital -->
  <g filter="url(#shadow)">
    <!-- Círculo esmeralda -->
    <circle cx="392" cy="380" r="76" fill="#10b981" stroke="#ffffff" stroke-width="12"/>
    <!-- Ponteiros do relógio -->
    <path d="M 392 332 L 392 380 L 424 380" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Ponto central -->
    <circle cx="392" cy="380" r="7" fill="#ffffff"/>
  </g>
</svg>
